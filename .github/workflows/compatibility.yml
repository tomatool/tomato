name: Compatibility

# Backward compatibility against the latest release: step vocabulary,
# resource types, CLI flags, Action inputs and a config corpus, checked by
# tomatool/tomato-compatibility. A documented break is listed in compatibility/breaking.txt
# in the same PR as its CHANGELOG entry; an unlisted one fails the job.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the candidate
        run: go build -o "$RUNNER_TEMP/tomato" .
      - name: Compare with the latest release
        uses: tomatool/tomato-compatibility@main
        with:
          candidate: ${{ runner.temp }}/tomato
          allow: compatibility/breaking.txt
          candidate-version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
