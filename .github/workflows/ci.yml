name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

  example-spring-boot-kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/spring-boot-kotlin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build tomato
        working-directory: .
        run: go build -o /usr/local/bin/tomato .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build the example service
        run: ./gradlew bootJar --no-daemon

      - name: Run tomato against the service
        run: tomato run --quiet

      - name: Coverage from the tomato run
        if: always()
        run: ./gradlew tomatoCoverage --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-kotlin-reports
          path: |
            examples/spring-boot-kotlin/build/reports/tomato/
            examples/spring-boot-kotlin/build/reports/tomato-coverage/

  coverage:
    # Unit tests + the integration suite on real containers, merged coverage,
    # and the gates in scripts/report-coverage.sh:
    #   - the integration suite passes
    #   - every step of every resource type is used by a scenario (100%)
    #   - code coverage stays at or above .coverage-min
    # The report is posted (and updated) as one comment on the pull request.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        run: go mod download

      - name: Unit + integration coverage and gates
        id: coverage
        run: make coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/report.md ]; then cat coverage/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/report.md
            coverage/coverage.out
            coverage/coverage.html
            coverage/steps.json
            .tomato/runs/

      - name: Post coverage comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('coverage/report.md')) return;
            const marker = '<!-- tomato-coverage-report -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = fs.readFileSync('coverage/report.md', 'utf8') +
              `\n---\n*From \`make coverage\` at ${context.sha.slice(0, 7)} · [run](${run})*\n`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && (c.body.includes(marker) || c.body.includes('Integration Test Coverage')));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }
