# Black-box tests for a Spring Boot + Kotlin service.
#
# tomato starts Postgres, Kafka and a Schema Registry, starts the app with a
# JaCoCo agent attached, and resets the database between scenarios.
#
#   ./gradlew bootJar     # builds build/libs/orders.jar and the JaCoCo agent
#   tomato run
#   ./gradlew tomatoCoverage   # coverage report from the tomato run

version: 2

settings:
  timeout: 10m
  fail_fast: false
  output: "pretty,junit:build/reports/tomato/junit.xml"
  reset:
    level: scenario

containers:
  postgres:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5432/tcp"
    wait_for:
      type: port
      target: "5432/tcp"
      timeout: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    env:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    ports:
      - "2181/tcp"
    wait_for:
      type: port
      target: "2181"
      timeout: 30s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    env:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: "{{.zookeeper.host}}:{{.zookeeper.port.2181}}"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "9092:9092"
      - "29092/tcp"
    wait_for:
      type: port
      target: "9092"
      timeout: 60s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    depends_on:
      - kafka
    env:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
    ports:
      - "8081/tcp"
    wait_for:
      type: http
      path: /subjects
      target: "8081"
      timeout: 90s

app:
  # The JaCoCo agent writes build/jacoco/tomato.exec when tomato stops the app.
  command: java -javaagent:build/jacoco/jacocoagent.jar=destfile=build/jacoco/tomato.exec -jar build/libs/orders.jar
  port: 8080
  ready:
    type: http
    path: /actuator/health
    timeout: 120s
  env:
    SPRING_DATASOURCE_URL: "jdbc:postgresql://{{.postgres.host}}:{{.postgres.port.5432}}/orders"
    SPRING_KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
    SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: "http://{{.schema-registry.host}}:{{.schema-registry.port.8081}}"

resources:
  api:
    type: http
    base_url: http://localhost:8080
    options:
      headers:
        Content-Type: application/json

  db:
    type: postgres
    container: postgres
    database: orders
    options:
      user: orders
      password: orders
      # Flyway's history table is never truncated. Reference data seeded by
      # a migration is kept by listing it here.
      exclude:
        - currencies

  kafka:
    type: kafka
    container: kafka
    options:
      # The app owns its topics; tomato leaves them in place and only clears
      # what it consumed between scenarios.
      reset_strategy: none
      schema_registry:
        container: schema-registry

features:
  paths:
    - features
