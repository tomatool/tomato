version: 2

settings:
  timeout: 5m
  fail_fast: false
  output: pretty

containers:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432/tcp"
    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    wait_for:
      type: port
      target: "5432"
      timeout: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379/tcp"
    # A log wait, so the lifecycle scenarios exercise the restart of a
    # container whose log already holds the line from its first start.
    wait_for:
      type: log
      target: "Ready to accept connections"
      timeout: 30s

  # The kafka preset: a single-node KRaft broker. tomato picks its host port and
  # advertises it, and other containers reach it at kafka:29092. The suite's
  # client uses the plain listener; aws_msk_iam adds the IAM listeners, so the
  # broker has to start with them.
  kafka:
    preset: kafka
    auth: aws_msk_iam

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    depends_on:
      - kafka
    env:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
    ports:
      - "8081/tcp"
    wait_for:
      type: http
      path: /subjects
      target: "8081"
      timeout: 90s

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data"]
    ports:
      - "9000/tcp"
    env:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    wait_for:
      type: port
      target: "9000"
      timeout: 30s

  rabbitmq:
    image: rabbitmq:3-alpine
    ports:
      - "5672/tcp"
    env:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    wait_for:
      type: port
      target: "5672"
      timeout: 90s

  scylla:
    image: scylladb/scylla:6.2
    # Single shard, small memory: enough for tests and CI runners.
    command: ["--smp", "1", "--memory", "512M", "--overprovisioned", "1", "--developer-mode", "1"]
    ports:
      - "9042/tcp"
    wait_for:
      type: port
      target: "9042"
      timeout: 120s

  # Headless Chromium for the browser resources. Pages it opens on localhost
  # reach the app on this machine, through a tunnel to the app's port and to
  # every localhost port the resources below name.
  chrome:
    preset: chromium

  # veraPDF, for the pdf resource's conformance step.
  verapdf:
    preset: verapdf

app:
  # Default: run as local process
  command: go run ./tests/app
  # Container mode (use with --container flag):
  # build:
  #   dockerfile: tests/app/Dockerfile
  #   context: .
  port: 8080
  ready:
    type: http
    path: /health
    timeout: 60s
  wait: 2s
  env:
    DATABASE_URL: "postgres://test:test@{{.postgres.host}}:{{.postgres.port.5432}}/test?sslmode=disable"
    REDIS_URL: "redis://{{.redis.host}}:{{.redis.port.6379}}"
    # The user directory's gRPC dependency, which the users resource stubs.
    USERS_ADDR: "{{.users.address}}"

resources:
  db:
    type: postgres
    container: postgres
    database: test
    options:
      user: test
      password: test

  scylla:
    type: scylladb
    container: scylla
    options:
      keyspace: tomato
      schema: tests/testdata/scylla/schema.cql
      exclude:
        - countries

  cache:
    type: redis
    container: redis

  events:
    type: kafka
    container: kafka
    options:
      topics:
        - test-events
        - test-orders
      partitions: 1
      replication_factor: 1
      reset_strategy: delete_recreate
      schema_registry:
        container: schema-registry
        subjects:
          mapped-orders: com.example.Order

  # Same broker, AWS Glue wire format: tomato serves the Glue Schema Registry on
  # a fixed port and points the app at it with AWS_ENDPOINT_URL_GLUE.
  glue-events:
    type: kafka
    container: kafka
    options:
      topics:
        - glue-orders
      partitions: 1
      replication_factor: 1
      reset_strategy: delete_recreate
      schema_registry:
        format: glue
        registry_name: portfolio
        region: eu-central-1
        compression: zlib
        port: 9994

  mq:
    type: rabbitmq
    container: rabbitmq
    options:
      user: guest
      password: guest
      reset_strategy: purge

  files:
    type: s3
    container: minio
    options:
      buckets:
        - uploads
        - reports

  api:
    type: http-client
    base_url: "http://localhost:8080"

  grpc:
    type: grpc
    address: "localhost:9090"

  shell:
    type: shell

  # Stops and starts the app and containers mid-scenario; every scenario
  # starts with all of them back up.
  lifecycle:
    type: lifecycle

  ws:
    type: websocket-client
    url: "ws://localhost:8080/ws"

  wsmock:
    type: websocket-server
    options:
      port: 9997

  wsmock-client:
    type: websocket-client
    url: "ws://localhost:9997/"

  # The gRPC service the app's user directory calls, stubbed from its
  # descriptor set (go test ./internal/grpcfixture -update regenerates it).
  users:
    type: grpc-server
    options:
      port: 9995
      descriptor_set: tests/testdata/grpc/users.binpb

  # Calls that stub directly, through the reflection it serves.
  users-grpc:
    type: grpc
    address: "localhost:9995"

  mock:
    type: http-server
    options:
      port: 9999

  mock2:
    type: http-server
    options:
      port: 9998

  # IRSA for the app: a role and a web identity token, exchanged at the STS this
  # resource serves; the app's AWS SDK finds both through its environment.
  aws:
    type: aws
    options:
      region: eu-central-1
      role_arn: arn:aws:iam::000000000000:role/tomato-tests
      ambient_identity: true
      port: 9996

  # Two people using the app's web UI, each in their own browser context.
  alice:
    type: browser
    container: chrome
    options:
      base_url: http://localhost:8080
      viewport: 1440x900
      locale: de-DE
      screenshots: .tomato/screenshots

  bob:
    type: browser
    container: chrome
    options:
      base_url: http://127.0.0.1:8080
      timeout: 3s

  # Calls the aws resource's STS directly.
  sts:
    type: http-client
    base_url: "http://localhost:9996"

  # The PDFs the app generates: read from an s3 object, an http response body
  # or a file, and asserted on. The validator checks PDF/UA and PDF/A.
  pdf:
    type: pdf
    options:
      validator: verapdf

features:
  paths:
    - ./tests/features
  tags: "~@skip-dynamic-port"
