site_name: 🍅 tomato
site_description: Language-agnostic behavioral testing tool with BDD support
site_author: tomato contributors
repo_url: https://github.com/tomatool/tomato
repo_name: tomatool/tomato

theme:
  name: material
  favicon: assets/favicon.svg
  palette:
    # Dark is the default, as it is in `tomato ui`.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/circle
        name: Switch to the light theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/circle-outline
        name: Switch to the dark theme
  font:
    text: Geist
    code: Geist Mono
  features:
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/tomato.css

extra_javascript:
  - javascripts/split-flow.js

nav:
  - Home: index.md
  - Documentation Map: overview.md
  - Guide:
    - Getting Started: getting-started/index.md
    - Writing a Suite: guide/philosophy.md
    - Test Coverage: getting-started/coverage.md
    - GitHub Action: getting-started/github-action.md
  - Configuration:
    - Reference: configuration/index.md
    - HTTP Server: configuration/http-server.md
    - gRPC: configuration/grpc.md
    - gRPC Server: configuration/grpc-server.md
    - Kafka: configuration/kafka.md
    - RabbitMQ: configuration/rabbitmq.md
    - ScyllaDB: configuration/scylladb.md
    - Redis: configuration/redis.md
    - S3: configuration/s3.md
    - AWS: configuration/aws.md
    - Lifecycle: configuration/lifecycle.md
    - Network: configuration/network.md
    - Profile: configuration/profile.md
    - Browser: configuration/browser.md
    - PDF: configuration/pdf.md
  - Step Reference:
    - Overview: resources/index.md
    - HTTP Client: resources/http-client.md
    - HTTP Server: resources/http-server.md
    - gRPC: resources/grpc.md
    - gRPC Server: resources/grpc-server.md
    - PostgreSQL: resources/postgres.md
    - ScyllaDB: resources/scylladb.md
    - Redis: resources/redis.md
    - Kafka: resources/kafka.md
    - RabbitMQ: resources/rabbitmq.md
    - Shell: resources/shell.md
    - WebSocket Client: resources/websocket-client.md
    - WebSocket Server: resources/websocket-server.md
    - S3: resources/s3.md
    - AWS: resources/aws.md
    - Lifecycle: resources/lifecycle.md
    - Network: resources/network.md
    - Browser: resources/browser.md
    - PDF: resources/pdf.md
  - Developer Guide:
    - Architecture: developer-guide/architecture.md
    - Adding a Step or Resource: developer-guide/adding-a-resource.md
    - "Design: Network Faults": developer-guide/network-faults.md
  - Stability: stability.md

markdown_extensions:
  # Without these, `!!! tip` renders as literal text — which it did on every
  # generated resource page — and code blocks get no highlighting at all.
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tomatool/tomato
  generator: false
