name: 'tomato-run'
description: 'Run behavioral tests with Tomato'
author: 'tomatool'
branding:
  icon: 'check-circle'
  color: 'red'

inputs:
  version:
    description: 'Tomato release to install (e.g., "v1.0.0"). Defaults to the action version tag; an action used at a commit or branch builds tomato from it instead.'
    required: false
    default: ''
  config:
    description: 'Config file path'
    required: false
    default: 'tomato.yml'
  features:
    description: 'Feature files or directories to run'
    required: false
    default: ''
  tags:
    description: 'Filter scenarios by tags (e.g., "@smoke and not @slow")'
    required: false
    default: ''
  scenario:
    description: 'Filter scenarios by name (regex pattern)'
    required: false
    default: ''
  no-reset:
    description: 'Skip state reset between scenarios (for debugging)'
    required: false
    default: 'false'
  verbose:
    description: 'Verbose output (show debug logs)'
    required: false
    default: 'false'
  quiet:
    description: 'Hide application logs during startup'
    required: false
    default: 'false'
  skip-validate:
    description: 'Skip configuration validation before running tests'
    required: false
    default: 'false'
  comment:
    description: 'Post/update a test summary comment on the PR'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # The action used at a commit or a branch (a pull request under review, say)
    # runs tomato built from that same commit, not the latest release, so the
    # action and the binary always match. Version tags and `version` install a
    # release as before.
    - name: Resolve Tomato source
      id: source
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        if [ -z "$INPUT_VERSION" ] && [ -n "$ACTION_REF" ] && ! [[ "$ACTION_REF" =~ ^v[0-9]+($|\.) ]]; then
          echo "build=true" >> "$GITHUB_OUTPUT"
        else
          echo "build=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Go
      if: steps.source.outputs.build == 'true'
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Build Tomato
      if: steps.source.outputs.build == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        echo "Building Tomato at ${ACTION_REF}"
        go build -ldflags "-X github.com/tomatool/tomato/internal/version.Commit=${ACTION_REF}" -o "$RUNNER_TEMP/tomato" .
        sudo install -m 0755 "$RUNNER_TEMP/tomato" /usr/local/bin/tomato
        tomato version

    - name: Install Tomato
      if: steps.source.outputs.build != 'true'
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"

        # Determine OS and architecture
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)

        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac

        # If no version specified, use the action's tag or latest
        if [ -z "$VERSION" ]; then
          ACTION_REF="${{ github.action_ref }}"

          # Check if it's a full version tag (e.g., v2.0.0)
          if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="$ACTION_REF"
          # Check if it's a major version tag (e.g., v2) - get latest of that major
          elif [[ "$ACTION_REF" =~ ^v([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            VERSION=$(curl -s https://api.github.com/repos/tomatool/tomato/releases | grep '"tag_name"' | grep "\"v${MAJOR}\." | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -z "$VERSION" ]; then
              # Fallback to latest if no matching major version found
              VERSION=$(curl -s https://api.github.com/repos/tomatool/tomato/releases/latest | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
            fi
          else
            # Fallback to latest release
            VERSION=$(curl -s https://api.github.com/repos/tomatool/tomato/releases/latest | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          fi
        fi

        # Remove 'v' prefix if present for download URL
        VERSION_NUM=${VERSION#v}

        echo "Installing Tomato ${VERSION} for ${OS}/${ARCH}"

        # Download and install
        DOWNLOAD_URL="https://github.com/tomatool/tomato/releases/download/${VERSION}/tomato_${VERSION_NUM}_${OS}_${ARCH}.tar.gz"
        echo "Downloading from: ${DOWNLOAD_URL}"

        # Download into a temp dir, not the workspace: a repo with a `tomato` file or
        # directory at its root would otherwise collide with the extracted binary.
        TMP_DIR=$(mktemp -d)
        curl -fsSL "$DOWNLOAD_URL" -o "$TMP_DIR/tomato.tar.gz"
        tar -xzf "$TMP_DIR/tomato.tar.gz" -C "$TMP_DIR" tomato
        sudo install -m 0755 "$TMP_DIR/tomato" /usr/local/bin/tomato
        rm -rf "$TMP_DIR"

        echo "Tomato installed successfully"
        tomato version

    - name: Validate Configuration
      if: inputs.skip-validate != 'true'
      shell: bash
      run: |
        CONFIG="${{ inputs.config }}"
        echo "Validating configuration: ${CONFIG}"
        tomato validate --config "${CONFIG}" --plain

    - name: Run Tomato Tests
      shell: bash
      run: |
        ARGS="run"

        # Config file
        if [ -n "${{ inputs.config }}" ]; then
          ARGS="$ARGS --config ${{ inputs.config }}"
        fi

        # Tags filter
        if [ -n "${{ inputs.tags }}" ]; then
          ARGS="$ARGS --tags '${{ inputs.tags }}'"
        fi

        # Scenario filter
        if [ -n "${{ inputs.scenario }}" ]; then
          ARGS="$ARGS --scenario '${{ inputs.scenario }}'"
        fi

        # No reset flag
        if [ "${{ inputs.no-reset }}" = "true" ]; then
          ARGS="$ARGS --no-reset"
        fi

        # Verbose flag
        if [ "${{ inputs.verbose }}" = "true" ]; then
          ARGS="$ARGS --verbose"
        fi

        # Quiet flag
        if [ "${{ inputs.quiet }}" = "true" ]; then
          ARGS="$ARGS --quiet"
        fi

        # Force tomato format when comment is enabled
        if [ "${{ inputs.comment }}" = "true" ]; then
          ARGS="$ARGS --format tomato"
        fi

        # Feature files
        if [ -n "${{ inputs.features }}" ]; then
          ARGS="$ARGS ${{ inputs.features }}"
        fi

        echo "Running: tomato $ARGS"

        if [ "${{ inputs.comment }}" = "true" ]; then
          START_TIME=$(date +%s)
          set +e
          eval "tomato $ARGS" 2>&1 | tee .tomato-output.log
          TOMATO_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          DURATION=$(( $(date +%s) - START_TIME ))
          echo "$TOMATO_EXIT_CODE" > .tomato-exit-code
          echo "$DURATION" > .tomato-duration
        else
          eval "tomato $ARGS"
        fi

    - name: Parse Test Results
      if: inputs.comment == 'true' && always()
      id: parse-results
      shell: bash
      run: |
        TOTAL=0
        PASSED=0
        FAILED=0
        SKIPPED=0
        STATUS="success"
        DETAILS=""
        FEATURES=0
        STEPS_PASSED=0
        STEPS_FAILED=0
        STEPS_SKIPPED=0
        SCENARIOS=""

        if [ -f .tomato-output.log ]; then
          while IFS= read -r line; do
            json="${line#TOMATO_EVENT:}"
            event_type=$(echo "$json" | jq -r '.type // empty' 2>/dev/null)

            case "$event_type" in
              summary)
                TOTAL=$(echo "$json" | jq -r '.total // 0')
                PASSED=$(echo "$json" | jq -r '.passed // 0')
                FAILED=$(echo "$json" | jq -r '.failed // 0')
                SKIPPED=$(echo "$json" | jq -r '.skipped // 0')
                ;;
              feature_start)
                FEATURES=$((FEATURES + 1))
                ;;
              scenario_end)
                feature=$(echo "$json" | jq -r '.feature // "Unknown"')
                scenario=$(echo "$json" | jq -r '.scenario // "Unknown"')
                scenario_status=$(echo "$json" | jq -r '.status // empty')
                if [ "$scenario_status" = "failed" ]; then
                  error=$(echo "$json" | jq -r '.error // "No error message"')
                  DETAILS="${DETAILS}\n❌ **${feature}** — \`${scenario}\`\n> ${error}\n"
                  SCENARIOS="${SCENARIOS}| ❌ | ${feature} | ${scenario} |\n"
                elif [ "$scenario_status" = "passed" ]; then
                  SCENARIOS="${SCENARIOS}| ✅ | ${feature} | ${scenario} |\n"
                else
                  SCENARIOS="${SCENARIOS}| ⏭️ | ${feature} | ${scenario} |\n"
                fi
                ;;
              step_end)
                step_status=$(echo "$json" | jq -r '.status // empty')
                case "$step_status" in
                  passed) STEPS_PASSED=$((STEPS_PASSED + 1)) ;;
                  failed|undefined|ambiguous) STEPS_FAILED=$((STEPS_FAILED + 1)) ;;
                  skipped|pending) STEPS_SKIPPED=$((STEPS_SKIPPED + 1)) ;;
                esac
                ;;
            esac
          done < <(grep '^TOMATO_EVENT:' .tomato-output.log)
        fi

        if [ "$FAILED" -gt 0 ]; then
          STATUS="failure"
        fi

        # Read duration
        DURATION="0"
        if [ -f .tomato-duration ]; then
          DURATION=$(cat .tomato-duration)
        fi

        echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
        echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
        echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
        echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
        echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        echo "features=$FEATURES" >> "$GITHUB_OUTPUT"
        echo "steps_passed=$STEPS_PASSED" >> "$GITHUB_OUTPUT"
        echo "steps_failed=$STEPS_FAILED" >> "$GITHUB_OUTPUT"
        echo "steps_skipped=$STEPS_SKIPPED" >> "$GITHUB_OUTPUT"
        echo "duration=$DURATION" >> "$GITHUB_OUTPUT"

        # Use delimiters for multi-line outputs
        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "details<<$EOF" >> "$GITHUB_OUTPUT"
        echo -e "$DETAILS" >> "$GITHUB_OUTPUT"
        echo "$EOF" >> "$GITHUB_OUTPUT"

        EOF2=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "scenarios<<$EOF2" >> "$GITHUB_OUTPUT"
        echo -e "$SCENARIOS" >> "$GITHUB_OUTPUT"
        echo "$EOF2" >> "$GITHUB_OUTPUT"

    - name: Build Comment Body
      if: inputs.comment == 'true' && always()
      id: build-comment
      uses: actions/github-script@v7
      # Results come in through env, never spliced into the script: scenario names and
      # error messages are test output, and a backtick or quote in them would break
      # (or inject into) the JavaScript.
      env:
        TOMATO_TOTAL: ${{ steps.parse-results.outputs.total }}
        TOMATO_PASSED: ${{ steps.parse-results.outputs.passed }}
        TOMATO_FAILED: ${{ steps.parse-results.outputs.failed }}
        TOMATO_SKIPPED: ${{ steps.parse-results.outputs.skipped }}
        TOMATO_FEATURES: ${{ steps.parse-results.outputs.features }}
        TOMATO_STEPS_PASSED: ${{ steps.parse-results.outputs.steps_passed }}
        TOMATO_STEPS_FAILED: ${{ steps.parse-results.outputs.steps_failed }}
        TOMATO_STEPS_SKIPPED: ${{ steps.parse-results.outputs.steps_skipped }}
        TOMATO_DURATION: ${{ steps.parse-results.outputs.duration }}
        TOMATO_STATUS: ${{ steps.parse-results.outputs.status }}
        TOMATO_DETAILS: ${{ steps.parse-results.outputs.details }}
        TOMATO_SCENARIOS: ${{ steps.parse-results.outputs.scenarios }}
      with:
        script: |
          const env = process.env;
          const total = parseInt(env.TOMATO_TOTAL) || 0;
          const passed = parseInt(env.TOMATO_PASSED) || 0;
          const failed = parseInt(env.TOMATO_FAILED) || 0;
          const skipped = parseInt(env.TOMATO_SKIPPED) || 0;
          const features = parseInt(env.TOMATO_FEATURES) || 0;
          const stepsPassed = parseInt(env.TOMATO_STEPS_PASSED) || 0;
          const stepsFailed = parseInt(env.TOMATO_STEPS_FAILED) || 0;
          const stepsSkipped = parseInt(env.TOMATO_STEPS_SKIPPED) || 0;
          const duration = parseInt(env.TOMATO_DURATION) || 0;
          const status = env.TOMATO_STATUS || '';
          const details = (env.TOMATO_DETAILS || '').trim();
          const scenarios = (env.TOMATO_SCENARIOS || '').trim();

          const emoji = status === 'success' ? '✅' : '❌';
          const mins = Math.floor(duration / 60);
          const secs = duration % 60;
          const durationStr = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
          const totalSteps = stepsPassed + stepsFailed + stepsSkipped;

          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

          let body = `## 🍅 Tomato Test Results\n\n`;
          body += `${emoji} **${total} scenarios** across ${features} feature${features !== 1 ? 's' : ''} in **${durationStr}**\n\n`;
          body += `| Scenarios | Steps |\n`;
          body += `|-----------|-------|\n`;
          body += `| ✅ ${passed} passed | ✅ ${stepsPassed} passed |\n`;

          if (failed > 0 || stepsFailed > 0) {
            body += `| ❌ ${failed} failed | ❌ ${stepsFailed} failed |\n`;
          }
          if (skipped > 0 || stepsSkipped > 0) {
            body += `| ⏭️ ${skipped} skipped | ⏭️ ${stepsSkipped} skipped |\n`;
          }

          if (details) {
            body += `\n<details>\n<summary>❌ Failed Scenarios</summary>\n\n${details}\n</details>\n`;
          }

          if (scenarios) {
            body += `\n<details>\n<summary>📋 All Scenarios</summary>\n\n`;
            body += `| | Feature | Scenario |\n|---|---------|----------|\n`;
            body += `${scenarios}\n</details>\n`;
          }

          body += `\n[View workflow run](${runUrl}) · *Generated by [tomato](https://github.com/tomatool/tomato)*`;

          core.setOutput('body', body);

    - name: Write Job Summary
      if: inputs.comment == 'true' && always()
      shell: bash
      env:
        TOMATO_COMMENT_BODY: ${{ steps.build-comment.outputs.body }}
      run: |
        printf '%s\n' "$TOMATO_COMMENT_BODY" >> "$GITHUB_STEP_SUMMARY"

    - name: Post PR Comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      env:
        TOMATO_COMMENT_BODY: ${{ steps.build-comment.outputs.body }}
      with:
        script: |
          const marker = '<!-- tomato-test-results -->';
          const body = marker + '\n' + (process.env.TOMATO_COMMENT_BODY || '');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Exit with test result
      if: inputs.comment == 'true' && always()
      shell: bash
      run: |
        if [ -f .tomato-exit-code ]; then
          exit $(cat .tomato-exit-code)
        fi
